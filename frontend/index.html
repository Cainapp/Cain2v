<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Nova IA</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0a0a0a;--panel:#1c1c1e;--panel-2:#262629;--accent:#0182c6;--text:#ececec;--muted:#8a8a8e;--radius:14px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{display:flex;height:100%}
.sidebar{width:220px;background:var(--panel);padding:20px 12px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--panel-2)}
.brand{font-size:1.2rem;color:var(--accent);font-weight:600;margin-bottom:18px}
.nav-item{background:none;border:none;color:var(--muted);text-align:left;padding:10px 12px;border-radius:var(--radius);cursor:pointer;font-size:.95rem}
.nav-item.active{background:var(--panel-2);color:var(--accent)}
.content{flex:1;padding:24px;overflow-y:auto;min-width:0}
.tab{display:none}
.tab.active{display:block}
#tab-chat.active{display:flex;flex-direction:column;height:100%}
.chat-log{flex:1;overflow-y:auto;margin-bottom:12px}
.chat-input-bar{display:flex;gap:8px;align-items:center}
#agent-select{width:auto;max-width:35%;margin:0}
#chat-input{flex:1;width:auto;min-width:0;margin:0;border-radius:999px}
input,textarea,select{width:100%;margin:6px 0;padding:10px 14px;border-radius:var(--radius);border:1px solid var(--panel-2);background:var(--panel);color:var(--text);font-size:16px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:600;font-size:15px}
.card-list{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--panel-2);border-left:3px solid var(--accent);border-radius:var(--radius);padding:12px 16px}
.msg{margin:8px 0;padding:10px 14px;border-radius:var(--radius);max-width:75%;white-space:pre-wrap}
.msg.user{background:var(--accent);color:#fff;margin-left:auto}
.msg.bot{background:var(--panel);border:1px solid var(--panel-2)}
@media(max-width:700px){
.app{flex-direction:column}
.content{order:1;padding:16px}
.sidebar{order:2;width:100%;flex-direction:row;justify-content:space-around;padding:8px;gap:4px;border-right:none;border-top:1px solid var(--panel-2)}
.brand{display:none}
.nav-item{flex:1;text-align:center;padding:10px 4px;font-size:.8rem}
.msg{max-width:88%}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="brand">✦ Nova IA</div>
    <button class="nav-item active" data-tab="chat">💬 Conversa</button>
    <button class="nav-item" data-tab="agentes">🧩 Agentes</button>
    <button class="nav-item" data-tab="cerebro">🧠 Cérebro</button>
    <button class="nav-item" data-tab="plugins">🔌 Plugins</button>
  </nav>
  <main class="content">
    <section id="tab-chat" class="tab active">
      <div id="chat-log" class="chat-log"></div>
      <div class="chat-input-bar">
        <select id="agent-select"><option value="">Padrão</option></select>
        <input id="chat-input" type="text" placeholder="Digite sua mensagem...">
        <button id="send-btn" class="primary">Enviar</button>
      </div>
    </section>
    <section id="tab-agentes" class="tab">
      <h2>Seus agentes</h2>
      <div id="agent-list" class="card-list"></div>
      <h3>Criar novo agente</h3>
      <input id="agent-name" placeholder="Nome do agente">
      <textarea id="agent-prompt" rows="4" placeholder="Personalidade / instruções"></textarea>
      <button id="create-agent-btn" class="primary">Criar agente</button>
    </section>
    <section id="tab-cerebro" class="tab">
      <h2>Temas em estudo contínuo</h2>
      <div id="topic-list" class="card-list"></div>
      <input id="new-topic" placeholder="Novo tema de interesse">
      <button id="add-topic-btn" class="primary">Adicionar tema</button>
      <h3>Conhecimento acumulado</h3>
      <div id="knowledge-list" class="card-list"></div>
    </section>
    <section id="tab-plugins" class="tab">
      <h2>APIs e plugins conectados</h2>
      <div id="plugin-list" class="card-list"></div>
      <input id="plugin-name" placeholder="Nome da integração">
      <input id="plugin-endpoint" placeholder="Endpoint da API">
      <button id="add-plugin-btn" class="primary">Adicionar</button>
    </section>
  </main>
</div>
<script>
const API_URL = 'https://nova-ia-backend.onrender.com';
const $ = id => document.getElementById(id);

// limpa service worker e cache antigos
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
}
if (window.caches) {
  caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
}

async function api(path, options) {
  const res = await fetch(API_URL + path, options);
  return res.json();
}
function post(path, body) {
  return api(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
}
function card(list, text) {
  const d = document.createElement('div');
  d.className = 'card';
  d.textContent = text;
  list.appendChild(d);
}

// abas
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    $('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'agentes') loadAgents();
    if (btn.dataset.tab === 'cerebro') loadBrain();
    if (btn.dataset.tab === 'plugins') loadPlugins();
  });
});

// chat
let history = [];
function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  d.textContent = text;
  $('chat-log').appendChild(d);
  $('chat-log').scrollTop = $('chat-log').scrollHeight;
}
async function sendMessage() {
  const text = $('chat-input').value.trim();
  if (!text) return;
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  $('chat-input').value = '';
  const opt = $('agent-select').selectedOptions[0];
  const agentPrompt = opt && opt.dataset.prompt ? opt.dataset.prompt : null;
  try {
    const data = await post('/api/chat', { messages: history, agentSystemPrompt: agentPrompt });
    addMsg('bot', data.reply || data.error || 'Sem resposta.');
    if (data.reply) history.push({ role: 'assistant', content: data.reply });
  } catch (e) {
    addMsg('bot', 'Erro ao conectar com o backend. Se ele estava parado, espere 1 minuto e tente de novo.');
  }
}
$('send-btn').addEventListener('click', sendMessage);
$('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

// agentes
async function loadAgents() {
  try {
    const agents = await api('/api/agents');
    $('agent-list').innerHTML = '';
    $('agent-select').innerHTML = '<option value="">Padrão</option>';
    agents.forEach(a => {
      card($('agent-list'), a.name + ' — ' + a.prompt.slice(0, 60) + '...');
      const o = document.createElement('option');
      o.value = a.id;
      o.textContent = a.name;
      o.dataset.prompt = a.prompt;
      $('agent-select').appendChild(o);
    });
  } catch (e) { card($('agent-list'), 'Não consegui carregar os agentes.'); }
}
$('create-agent-btn').addEventListener('click', async () => {
  const name = $('agent-name').value.trim();
  const prompt = $('agent-prompt').value.trim();
  if (!name || !prompt) return;
  await post('/api/agents', { name, prompt });
  $('agent-name').value = '';
  $('agent-prompt').value = '';
  loadAgents();
});

// cérebro
async function loadBrain() {
  try {
    const topics = await api('/api/brain/topics');
    const knowledge = await api('/api/brain/knowledge');
    $('topic-list').innerHTML = '';
    $('knowledge-list').innerHTML = '';
    topics.forEach(t => card($('topic-list'), t.topic + ' — último estudo: ' + (t.lastStudied || 'ainda não')));
    knowledge.slice().reverse().forEach(k => card($('knowledge-list'), '[' + k.topic + '] ' + k.summary));
  } catch (e) { card($('topic-list'), 'Não consegui carregar o cérebro.'); }
}
$('add-topic-btn').addEventListener('click', async () => {
  const topic = $('new-topic').value.trim();
  if (!topic) return;
  await post('/api/brain/topics', { topic });
  $('new-topic').value = '';
  loadBrain();
});

// plugins
async function loadPlugins() {
  try {
    const plugins = await api('/api/plugins');
    $('plugin-list').innerHTML = '';
    plugins.forEach(p => card($('plugin-list'), p.name + ' — ' + p.endpoint));
  } catch (e) { card($('plugin-list'), 'Não consegui carregar os plugins.'); }
}
$('add-plugin-btn').addEventListener('click', async () => {
  const name = $('plugin-name').value.trim();
  const endpoint = $('plugin-endpoint').value.trim();
  if (!name || !endpoint) return;
  await post('/api/plugins', { name, endpoint });
  $('plugin-name').value = '';
  $('plugin-endpoint').value = '';
  loadPlugins();
});
</script>
</body>
</html>
